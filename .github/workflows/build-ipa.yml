name: Build iOS IPA (Unsigned)
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Select available Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer; fi
          xcodebuild -version
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build unsigned IPA with RoboVM
        run: ./gradlew -p ios createIPA --no-daemon --stacktrace -Probovm.iosSkipSigning=true -Dorg.gradle.java.home="$JAVA_HOME"
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Artifact
          path: ios/build/robovm/**/*.ipa
          if-no-files-found: error
